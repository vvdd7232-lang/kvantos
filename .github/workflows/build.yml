name: build
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-multilib nasm xorriso mtools grub-pc-bin grub-common binutils python3
      - name: kernel
        run: make
      - name: multiboot check
        run: grub-file --is-x86-multiboot build/kvant.bin
      - name: apps
        run: make apps
      - name: release (iso + floppy)
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: kvantos-iso
          path: release/kvantos.iso
      - uses: actions/upload-artifact@v4
        with:
          name: kvantos-kernel
          path: release/kvant.bin
