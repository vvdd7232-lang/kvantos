name: Ошибка
description: Воспроизводимая ошибка ОС, компилятора или носителя
body:
  - type: markdown
    attributes:
      value: Не прикладывайте токены, пароли или образы с личными данными. Не форматируйте носитель ради воспроизведения.
  - type: input
    id: version
    attributes:
      label: Версия / commit
      placeholder: Точный tag или git rev-parse HEAD; опубликованный ISO или локальная сборка
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Среда
      options:
        - QEMU BIOS32
        - QEMU UEFI64
        - VirtualBox
        - Физическое оборудование
        - Host test без загрузки ОС
        - Другая / неизвестна
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Конфигурация
      description: CPU/RAM, firmware, версия эмулятора и его command line; для USB — контроллер, hub/скорость, GPT/MBR/FAT и RO/opt-in/WAL. Для приложения — ABI3/ring0 или ABI4/CPL3. Не публикуйте серийные номера.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги и минимальный пример
      description: Действия мышью/команды; для compiler ошибки — минимальный исходник, строка/текст диагностики. Не заменяйте импорт копированием через host KvFS image без указания этого отличия.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Ожидание и фактический результат
      description: При storage ошибке укажите, сохранились ли caller document/старый файл, был ли reboot/reconnect; не повторяйте WRITE вслепую.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи / скриншоты / выполненные проверки
      description: COM1, result.json, точные команды и exit status; отделите PASS от непроверенного. Данные и credentials предварительно удалите.
