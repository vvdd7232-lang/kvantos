# ============================================================
#  KvantOS - меню загрузчика
#
#  Меню намеренно рисуется в ТЕКСТОВОМ режиме VGA и латиницей.
#  Причина: на старых машинах переключение меню в графику
#  (gfxterm) даёт чёрный экран - видно только "Welcome to GRUB!".
#  А в текстовом режиме VGA нет кириллицы: русские буквы
#  превращаются в "?????". Латиница читается везде.
#  Само ядро KvantOS выводит полноценный русский текст.
# ============================================================

insmod part_msdos
insmod iso9660
insmod multiboot
insmod all_video
insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus

# Меню - на обычной текстовой консоли: работает на любом железе.
terminal_output console

# ВНИМАНИЕ: команды serial здесь НЕТ намеренно.
# На ноутбуках без физического UART (Samsung RV410 и подобные)
# вывод в несуществующий порт 0x3F8 заставляет GRUB ждать таймаут
# на КАЖДОМ символе - меню выглядит как зависшее сразу после
# "Welcome to GRUB!". Диагностика вынесена на индикаторы клавиатуры.

# Ядро вложено ВНУТРЬ загрузочного образа (memdisk), поэтому корень
# менять не нужно: /boot/kvant.bin читается из памяти, а не с привода.
# Это главное лекарство от зависания на изношенных DVD.

# Ищем сам носитель: образ загрузчика для установки на винчестер
# лежит файлом на диске, а не в memdisk (тот ограничен 480 КБ).
# Если носитель не найден, переменная останется пустой - ядро
# просто не предложит установку, но загрузится как обычно.
search --no-floppy --file --set=kvsrc /boot/hdboot.img

set timeout=10
set default=0

menuentry "KvantOS 0.1.0 Photon - graphics, auto (recommended)" {
    # 1366x768 намеренно НЕ первый: этой моды почти нет в таблицах VBE
    # (ширина не кратна 8), и попытка её задать роняла выбор на 800x600.
    # Порядок: надёжное 1024x768, затем широкие варианты, затем запас.
    set gfxpayload=1024x768x32,1280x768x32,1280x720x32,1024x768,800x600x32,auto
    multiboot /boot/kvant.bin
    module ($kvsrc)/boot/hdboot.img hdboot.img
    module /boot/apps/clock.kapp clock.kapp
    module /boot/apps/notes.kapp notes.kapp
    module /boot/apps/snake.kapp snake.kapp
    boot
}

menuentry "KvantOS - widescreen 1280x768 (16:9 laptops)" {
    set gfxpayload=1280x768x32,1280x720x32,1280x768
    multiboot /boot/kvant.bin
    module ($kvsrc)/boot/hdboot.img hdboot.img
    module /boot/apps/clock.kapp clock.kapp
    module /boot/apps/notes.kapp notes.kapp
    module /boot/apps/snake.kapp snake.kapp
    boot
}

menuentry "KvantOS - graphics 1024x768" {
    set gfxpayload=1024x768x32,1024x768
    multiboot /boot/kvant.bin
    module ($kvsrc)/boot/hdboot.img hdboot.img
    module /boot/apps/clock.kapp clock.kapp
    module /boot/apps/notes.kapp notes.kapp
    module /boot/apps/snake.kapp snake.kapp
    boot
}

menuentry "KvantOS - graphics 800x600" {
    set gfxpayload=800x600x32,800x600
    multiboot /boot/kvant.bin
    module ($kvsrc)/boot/hdboot.img hdboot.img
    module /boot/apps/clock.kapp clock.kapp
    module /boot/apps/notes.kapp notes.kapp
    module /boot/apps/snake.kapp snake.kapp
    boot
}

menuentry "KvantOS - VGA text 80x25 (old machines)" {
    set gfxpayload=text
    multiboot /boot/kvant.bin text
    module ($kvsrc)/boot/hdboot.img hdboot.img
    module /boot/apps/clock.kapp clock.kapp
    module /boot/apps/notes.kapp notes.kapp
    module /boot/apps/snake.kapp snake.kapp
    boot
}

menuentry "KvantOS - safe mode (text, no PCI / no mouse)" {
    set gfxpayload=text
    multiboot /boot/kvant.bin text safe
    boot
}

menuentry "Reboot" {
    reboot
}

menuentry "Power off" {
    halt
}
