# ============================================================
#  KvantOS - bootloader menu
#
#  The menu is deliberately drawn in VGA TEXT mode using Latin
#  letters only. Reason: on older machines switching the menu to
#  graphics (gfxterm) yields a black screen - all you see is
#  "Welcome to GRUB!". And VGA text mode has no Cyrillic glyphs,
#  so Russian letters would turn into "?????". Latin reads
#  everywhere. The kernel itself renders full Unicode text.
# ============================================================

insmod part_msdos
insmod iso9660
insmod multiboot
insmod all_video
insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus

# The menu lives on the plain text console: works on any hardware.
terminal_output console

# NOTE: there is deliberately NO serial command here.
# On laptops without a physical UART (Samsung RV410 and friends)
# writing to the non-existent port 0x3F8 makes GRUB wait for a
# timeout on EVERY character - the menu looks frozen right after
# "Welcome to GRUB!". Diagnostics go to the keyboard LEDs instead.

# The kernel is embedded INSIDE the boot image (memdisk), so there is
# no need to change the root: /boot/kvant.bin is read from memory
# rather than from the drive. This is the main cure for hangs on
# worn-out DVDs.

# Locate the media itself: the bootloader image used to install onto
# a hard disk sits as a file on the medium, not in the memdisk (which
# is capped at ~480 KB). If the medium is not found the variable stays
# empty - the kernel simply will not offer installation, but still boots.
search --no-floppy --file --set=kvsrc /boot/hdboot.img

set timeout=10
set default=0

menuentry "KvantOS 0.1.0 Photon - graphics, auto (recommended)" {
    # 1366x768 is deliberately NOT first: that mode is nearly absent from
    # VBE tables (its width is not a multiple of 8) and asking for it used
    # to drop the choice down to 800x600. Order: the dependable 1024x768,
    # then widescreen options, then fallbacks.
    set gfxpayload=1024x768x32,1280x768x32,1280x720x32,1024x768,800x600x32,auto
    multiboot /boot/kvant.bin
    module ($kvsrc)/boot/hdboot.img hdboot.img
    module /boot/apps/clock.kapp clock.kapp
    module /boot/apps/notes.kapp notes.kapp
    module /boot/apps/snake.kapp snake.kapp
    boot
}

menuentry "KvantOS - Russian interface (russkiy interfeys)" {
    # lang=ru switches the whole system to Russian. The same can be
    # done later from the shell with: lang ru
    set gfxpayload=1024x768x32,1280x768x32,1280x720x32,1024x768,800x600x32,auto
    multiboot /boot/kvant.bin lang=ru
    module ($kvsrc)/boot/hdboot.img hdboot.img
    module /boot/apps/clock.kapp clock.kapp
    module /boot/apps/notes.kapp notes.kapp
    module /boot/apps/snake.kapp snake.kapp
    boot
}

menuentry "KvantOS - widescreen 1280x768 (16:9 laptops)" {
    set gfxpayload=1280x768x32,1280x720x32,1280x768
    multiboot /boot/kvant.bin
    module ($kvsrc)/boot/hdboot.img hdboot.img
    module /boot/apps/clock.kapp clock.kapp
    module /boot/apps/notes.kapp notes.kapp
    module /boot/apps/snake.kapp snake.kapp
    boot
}

menuentry "KvantOS - graphics 1024x768" {
    set gfxpayload=1024x768x32,1024x768
    multiboot /boot/kvant.bin
    module ($kvsrc)/boot/hdboot.img hdboot.img
    module /boot/apps/clock.kapp clock.kapp
    module /boot/apps/notes.kapp notes.kapp
    module /boot/apps/snake.kapp snake.kapp
    boot
}

menuentry "KvantOS - graphics 800x600" {
    set gfxpayload=800x600x32,800x600
    multiboot /boot/kvant.bin
    module ($kvsrc)/boot/hdboot.img hdboot.img
    module /boot/apps/clock.kapp clock.kapp
    module /boot/apps/notes.kapp notes.kapp
    module /boot/apps/snake.kapp snake.kapp
    boot
}

menuentry "KvantOS - VGA text 80x25 (old machines)" {
    set gfxpayload=text
    multiboot /boot/kvant.bin text
    module ($kvsrc)/boot/hdboot.img hdboot.img
    module /boot/apps/clock.kapp clock.kapp
    module /boot/apps/notes.kapp notes.kapp
    module /boot/apps/snake.kapp snake.kapp
    boot
}

menuentry "KvantOS - safe mode (text, no PCI / no mouse)" {
    set gfxpayload=text
    multiboot /boot/kvant.bin text safe
    boot
}

menuentry "Reboot" {
    reboot
}

menuentry "Power off" {
    halt
}
