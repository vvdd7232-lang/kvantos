# A ready-made workflow for GitHub Actions.
# To enable build checking, copy this file to
#   .github/workflows/build.yml
# (through the GitHub web interface or with a token that has the
# "workflow" scope). It is not stored in .github/workflows itself:
# the publishing token did not carry that permission.

# Building KvantOS on a clean machine: this proves the repository
# alone is enough to produce a bootable image.
name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib nasm xorriso mtools grub-pc-bin grub-common \
            binutils python3

      - name: Build the kernel
        run: make

      - name: Check the Multiboot header
        run: grub-file --is-x86-multiboot build/kvant.bin

      - name: Build the SDK applications
        run: make apps

      - name: Build the images
        run: make release

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kvantos-images
          path: kvantos-*.tar.gz
